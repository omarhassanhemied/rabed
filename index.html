<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رابض - فويس أوفر بكل اللهجات</title>
<style>
  :root{--bg:#f7f5fc;--card:#fff;--line:#e3def2;--txt:#1d1936;--mut:#7a7596;--a1:#7c3aed;--a2:#db2777;--err:#e11d48;--ok:#059669}
  @media (prefers-color-scheme:dark){:root{--bg:#120f22;--card:#1b1731;--line:#2e2850;--txt:#f1eefc;--mut:#a29cc4}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Segoe UI,Tahoma,Arial,sans-serif;line-height:1.6;min-height:100vh}
  main{max-width:640px;margin:0 auto;padding:36px 16px 60px}
  h1{font-size:2.2rem;margin:0;text-align:center;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--mut);text-align:center;margin:6px 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 30px rgba(124,58,237,.08)}
  textarea{width:100%;min-height:150px;padding:14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--txt);font:inherit;font-size:1.05rem;resize:vertical}
  textarea:focus,select:focus{outline:2px solid var(--a1);outline-offset:1px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:4px}
  select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit}
  .btns{display:flex;gap:8px;margin-top:16px}
  #play{flex:1;padding:14px;border:0;border-radius:14px;color:#fff;font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--a1),var(--a2))}
  #dl{padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--txt);font:inherit;cursor:pointer}
  button:disabled{opacity:.55;cursor:wait}
  #msg{text-align:center;margin-top:12px;font-size:.9rem;color:var(--mut);min-height:1.4em}
  #msg.err{color:var(--err)} #msg.ok{color:var(--ok)}
  #out{display:none;margin-top:14px}
  audio{width:100%}
</style>
</head>
<body>
<main>
  <h1>🎙️ رابض</h1>
  <p class="sub">اكتب النص، اختار اللهجة والصوت، واسمعه.</p>

  <div class="card">
    <textarea id="text" placeholder="اكتب النص هنا...">هلا والله ومرحبا فيكم! كيف حالكم يا جماعة؟ اليوم بشرح لكم شي بسيط وحلو، بس ركزوا معي زين.</textarea>

    <div class="row">
      <div>
        <label for="dialect">اللهجة / اللغة</label>
        <select id="dialect"></select>
      </div>
      <div>
        <label for="voice">الصوت</label>
        <select id="voice">
          <optgroup label="أنثى">
            <option value="Kore">أنثى - واضحة</option>
            <option value="Aoede">أنثى - دافية</option>
            <option value="Leda">أنثى - شابة</option>
          </optgroup>
          <optgroup label="ذكر">
            <option value="Charon">ذكر - هادي</option>
            <option value="Orus">ذكر - قوي</option>
            <option value="Puck">ذكر - حيوي</option>
          </optgroup>
        </select>
      </div>
    </div>

    <div class="btns">
      <button id="play">▶ حوّل لصوت</button>
      <button id="dl" disabled>⬇ تحميل</button>
    </div>
    <div id="msg"></div>
    <div id="out"><audio id="player" controls></audio></div>
  </div>
</main>

<script>
// رابط الـ Worker على Cloudflare (المفتاح محفوظ هناك مش في الكود)
const WORKER_URL = 'https://billowing-snow-10f5rabed-voice.omarhassanhemied.workers.dev/';

const $ = id => document.getElementById(id);
function say(t, c = '') { const m = $('msg'); m.textContent = t; m.className = c; }

const LANGS = [
  ['عربي', [
    ['مصري', 'Egyptian Arabic dialect'],
    ['سعودي', 'Saudi Arabic dialect (Najdi/Hejazi, Saudi Arabia)'],
    ['خليجي', 'Gulf Arabic dialect (Emirati/Kuwaiti/Qatari)'],
    ['شامي', 'Levantine Arabic dialect (Syrian/Lebanese/Palestinian/Jordanian)'],
    ['عراقي', 'Iraqi Arabic dialect'],
    ['يمني', 'Yemeni Arabic dialect'],
    ['سوداني', 'Sudanese Arabic dialect'],
    ['ليبي', 'Libyan Arabic dialect'],
    ['تونسي', 'Tunisian Arabic dialect'],
    ['جزائري', 'Algerian Arabic dialect'],
    ['مغربي', 'Moroccan Arabic (Darija)'],
    ['فصحى', 'Modern Standard Arabic (Fusha)']
  ]],
  ['لغات تانية', [
    ['English (US)', 'American English'],
    ['English (UK)', 'British English'],
    ['Español', 'Castilian Spanish'],
    ['Français', 'Parisian French'],
    ['Deutsch', 'German'],
    ['Italiano', 'Italian'],
    ['Português', 'Brazilian Portuguese'],
    ['Türkçe', 'Turkish'],
    ['Русский', 'Russian'],
    ['हिन्दी', 'Hindi'],
    ['اردو', 'Urdu'],
    ['日本語', 'Japanese'],
    ['한국어', 'Korean'],
    ['中文', 'Mandarin Chinese']
  ]]
];
const FLAT = [];
LANGS.forEach(([g, items]) => {
  const og = document.createElement('optgroup'); og.label = g;
  items.forEach(it => { og.appendChild(new Option(it[0], FLAT.length)); FLAT.push(it); });
  $('dialect').appendChild(og);
});

// تقسيم النص الطويل لأجزاء على حدود الجمل
function chunk(text, max = 900) {
  const sentences = text.match(/[^.!؟?،,\n]+[.!؟?،,\n]*/g) || [text];
  const out = []; let cur = '';
  for (const s of sentences) {
    if ((cur + s).length > max && cur) { out.push(cur.trim()); cur = ''; }
    cur += s;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

const b64ToBytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

function pcmToWav(pcm, rate = 24000) {
  const h = new ArrayBuffer(44), v = new DataView(h);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, pcm.length, true);
  return new Blob([h, pcm], { type: 'audio/wav' });
}

async function tts(text, desc, voice) {
  if (WORKER_URL.startsWith('PASTE')) throw new Error('الموقع لسه مش متوصل بالسيرفر');
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, desc, voice })
  });
  if (!res.ok) {
    if (res.status === 429) throw new Error('الحصة المجانية مؤقتًا خلصت، جرب بعد دقيقة');
    throw new Error('خطأ في السيرفر (' + res.status + ')');
  }
  const data = await res.json();
  if (!data.audio) throw new Error('ما رجعش صوت، جرب نص تاني');
  return b64ToBytes(data.audio);
}

let wavUrl = null;

$('play').onclick = async () => {
  const text = $('text').value.trim().replace(/\s*\n+\s*/g, ' ');
  if (!text) { say('اكتب نص الأول', 'err'); return; }
  $('play').disabled = true; $('dl').disabled = true; $('out').style.display = 'none';
  try {
    const [, desc] = FLAT[$('dialect').value];
    const parts = chunk(text);
    const pcms = [];
    for (let i = 0; i < parts.length; i++) {
      say(parts.length > 1 ? `جاري التوليد... (${i + 1}/${parts.length})` : 'جاري التوليد...');
      pcms.push(await tts(parts[i], desc, $('voice').value));
    }
    const total = pcms.reduce((n, p) => n + p.length, 0);
    const all = new Uint8Array(total); let o = 0;
    pcms.forEach(p => { all.set(p, o); o += p.length; });
    if (wavUrl) URL.revokeObjectURL(wavUrl);
    wavUrl = URL.createObjectURL(pcmToWav(all));
    $('player').src = wavUrl; $('out').style.display = 'block'; $('dl').disabled = false;
    await $('player').play().catch(() => {});
    say('تم ✔', 'ok');
  } catch (e) {
    console.error(e);
    say('حصلت مشكلة: ' + (e.message || 'جرب تاني'), 'err');
  } finally { $('play').disabled = false; }
};

$('dl').onclick = () => {
  if (!wavUrl) return;
  const a = document.createElement('a');
  a.href = wavUrl; a.download = 'rabed-voiceover.wav'; a.click();
  say('تم التحميل ✔ (جاهز تحطه في كاب كات)', 'ok');
};
</script>
</body>
</html>
