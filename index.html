<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رابض - فويس أوفر بكل اللهجات</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root{--bg:#f7f5fc;--card:#fff;--line:#e3def2;--txt:#1d1936;--mut:#7a7596;--a1:#7c3aed;--a2:#db2777;--err:#e11d48;--ok:#059669}
  @media (prefers-color-scheme:dark){:root{--bg:#120f22;--card:#1b1731;--line:#2e2850;--txt:#f1eefc;--mut:#a29cc4}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Segoe UI,Tahoma,Arial,sans-serif;line-height:1.6;min-height:100vh}
  main{max-width:640px;margin:0 auto;padding:36px 16px 60px}
  h1{font-size:2.2rem;margin:0;text-align:center;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--mut);text-align:center;margin:6px 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 30px rgba(124,58,237,.08)}
  textarea{width:100%;min-height:150px;padding:14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--txt);font:inherit;font-size:1.05rem;resize:vertical}
  textarea:focus,select:focus{outline:2px solid var(--a1);outline-offset:1px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:4px}
  select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit}
  #play{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;color:#fff;font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--a1),var(--a2))}
  #play:disabled{opacity:.6;cursor:wait}
  #msg{text-align:center;margin-top:12px;font-size:.9rem;color:var(--mut);min-height:1.4em}
  #msg.err{color:var(--err)} #msg.ok{color:var(--ok)}
  #out{display:none;margin-top:14px}
  audio{width:100%}
  #dl{display:block;width:100%;margin-top:8px;padding:11px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--txt);font:inherit;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>🎙️ رابض</h1>
  <p class="sub">اكتب النص، اختار اللهجة والصوت، واسمعه.</p>

  <div class="card">
    <textarea id="text" placeholder="اكتب النص هنا...">أهلاً بيكم! ده تجربة فويس أوفر بصوت طبيعي وبلهجة مصرية.</textarea>

    <div class="row">
      <div>
        <label for="dialect">اللهجة / اللغة</label>
        <select id="dialect">
          <optgroup label="عربي">
            <option value="Egyptian Arabic dialect">مصري</option>
            <option value="Saudi Arabic dialect (Najdi/Hejazi, Saudi Arabia)">سعودي</option>
            <option value="Gulf Arabic dialect (Emirati/Kuwaiti/Qatari)">خليجي</option>
            <option value="Levantine Arabic dialect (Syrian/Lebanese/Palestinian/Jordanian)">شامي</option>
            <option value="Iraqi Arabic dialect">عراقي</option>
            <option value="Yemeni Arabic dialect">يمني</option>
            <option value="Sudanese Arabic dialect">سوداني</option>
            <option value="Libyan Arabic dialect">ليبي</option>
            <option value="Moroccan Arabic (Darija)">مغربي</option>
            <option value="Algerian Arabic dialect">جزائري</option>
            <option value="Tunisian Arabic dialect">تونسي</option>
            <option value="Modern Standard Arabic (Fusha)">فصحى</option>
          </optgroup>
          <optgroup label="لغات تانية">
            <option value="American English">English</option>
            <option value="British English">English (UK)</option>
            <option value="Castilian Spanish">Español</option>
            <option value="Parisian French">Français</option>
            <option value="German">Deutsch</option>
            <option value="Italian">Italiano</option>
            <option value="Brazilian Portuguese">Português</option>
            <option value="Turkish">Türkçe</option>
            <option value="Russian">Русский</option>
            <option value="Hindi">हिन्दी</option>
            <option value="Urdu">اردو</option>
            <option value="Japanese">日本語</option>
            <option value="Korean">한국어</option>
            <option value="Mandarin Chinese">中文</option>
          </optgroup>
        </select>
      </div>
      <div>
        <label for="voice">الصوت</label>
        <select id="voice">
          <optgroup label="أنثى">
            <option value="21m00Tcm4TlvDq8ikWAM">أنثى - هادية</option>
            <option value="EXAVITQu4vr4xnSDxMzL">أنثى - ناعمة</option>
            <option value="AZnzlk1XvdvUeBnXmlld">أنثى - حيوية</option>
          </optgroup>
          <optgroup label="ذكر">
            <option value="pNInz6obpgDQGcFmaJgB">ذكر - عميق</option>
            <option value="ErXwobaYiN019PkySvjV">ذكر - دافي</option>
            <option value="TxGEqnHWrfWFTfGW9XjX">ذكر - شبابي</option>
          </optgroup>
        </select>
      </div>
    </div>

    <button id="play">▶ حوّل لصوت</button>
    <div id="msg"></div>
    <div id="out">
      <audio id="player" controls></audio>
      <button id="dl">⬇ تحميل MP3</button>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let lastUrl = null;
function say(t, c = '') { const m = $('msg'); m.textContent = t; m.className = c; }

$('play').onclick = async () => {
  const text = $('text').value.trim();
  if (!text) { say('اكتب نص الأول', 'err'); return; }
  $('play').disabled = true; $('out').style.display = 'none';
  say('جاري توليد الصوت... (أول مرة ممكن يطلب تسجيل دخول مجاني من Puter)');
  try {
    // سطور جديدة و"..." بتعمل سكتات طويلة، فبنحوّلها لمسافات وفواصل عادية
    const clean = text.replace(/\s*\n+\s*/g, ' ').replace(/\.{2,}|…/g, '،').replace(/\s{2,}/g, ' ');
    // 1) نكتب النص باللهجة المطلوبة بأسلوب كلام طبيعي (ElevenLabs بينطق حسب الكتابة)
    let spoken = clean;
    try {
      say('بكتب النص باللهجة...');
      const r = await puter.ai.chat(
        `Rewrite the following text so it is spoken naturally in ${$('dialect').value}, the way a real native person talks in everyday conversation. ` +
        `If it is already in that dialect or language, keep it almost unchanged. Keep the meaning. Use natural short phrases and normal punctuation (commas and periods) so it flows. ` +
        `Output ONLY the final text, nothing else.\n\nText:\n${clean}`,
        { model: 'gpt-4o-mini' }
      );
      const t = typeof r === 'string' ? r : (r?.message?.content?.[0]?.text ?? r?.message?.content ?? '');
      if (typeof t === 'string' && t.trim()) spoken = t.trim();
    } catch (e) { console.warn('rewrite skipped', e); }

    // 2) صوت بشري عالي الجودة من ElevenLabs
    say('بحوّل لصوت...');
    const speak = model => puter.ai.txt2speech(spoken, { provider: 'elevenlabs', model, voice: $('voice').value });
    let audio;
    try { audio = await speak('eleven_v3'); }
    catch (e) { console.warn('v3 failed, falling back', e); audio = await speak('eleven_multilingual_v2'); }
    lastUrl = audio.src;
    $('player').src = lastUrl;
    $('out').style.display = 'block';
    await $('player').play();
    say('تم ✔', 'ok');
  } catch (e) {
    console.error(e);
    say('حصلت مشكلة: ' + (e?.message || e?.error?.message || 'جرب تاني'), 'err');
  } finally { $('play').disabled = false; }
};

$('dl').onclick = async () => {
  if (!lastUrl) return;
  try {
    const b = await (await fetch(lastUrl)).blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'rabed-voiceover.mp3'; a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { say('كليك يمين على المشغل واختار Save audio as', 'err'); }
};
</script>
</body>
</html>
